services:
  postgres:
    image: postgres:16.14
    profiles: ["core", "postgres", "cdc", "dyna-report"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  mysql8:
    image: mysql:8.0.39
    profiles: ["core", "mysql", "ragflow", "cdc"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    command:
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --expire-logs-days=7
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version=TLSv1.2,TLSv1.3
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    profiles: ["core", "minio", "ragflow", "dyna-report"]
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_CONSOLE_PORT}:9001
    volumes:
      - minio_data:/data
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.8
    profiles: ["core", "valkey", "ragflow"]
    command: ["redis-server", "--requirepass", "${VALKEY_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - ${VALKEY_PORT}:6379
    volumes:
      - valkey_data:/data
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  es8-ragflow:
    image: elasticsearch:8.11.3
    profiles: ["es8", "ragflow"]
    environment:
      node.name: es8-ragflow
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    mem_limit: ${ES8_MEM_LIMIT}
    ports:
      - ${ES8_RAGFLOW_PORT}:9200
    volumes:
      - es8_ragflow_data:/usr/share/elasticsearch/data
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  es7-cdc:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    profiles: ["es7", "cdc"]
    environment:
      node.name: es7-cdc
      discovery.type: single-node
      xpack.security.enabled: "${ES7_SECURITY_ENABLED:-false}"
      ES7_SECURITY_ENABLED: "${ES7_SECURITY_ENABLED:-false}"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: ${ES7_MEM_LIMIT}
    ports:
      - ${ES7_CDC_PORT}:9200
    volumes:
      - es7_cdc_data:/usr/share/elasticsearch/data
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${ES7_SECURITY_ENABLED:-false}\" = \"true\" ]; then curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1; else curl -fs http://localhost:9200 >/dev/null || exit 1; fi"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  flink-jobmanager:
    image: flink:1.20.3-scala_2.12-java17
    profiles: ["flink", "cdc"]
    entrypoint: ["/bin/sh", "-c", "chown -R flink:flink /opt/flink/checkpoints /opt/flink/savepoints && exec /docker-entrypoint.sh jobmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: ${FLINK_JM_MEM:-1600m}
        jobmanager.memory.jvm-metaspace.size: ${FLINK_JM_METASPACE:-1g}
        execution.checkpointing.storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: ${FLINK_CK_INTERVAL:-60s}
        execution.checkpointing.min-pause: 30s
        execution.checkpointing.timeout: 10min
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.tolerable-failed-checkpoints: 3
        execution.checkpointing.num-retained: 3
        execution.checkpointing.mode: EXACTLY_ONCE
        restart-strategy.type: exponential-delay
        restart-strategy.exponential-delay.initial-backoff: 10s
        restart-strategy.exponential-delay.max-backoff: 2min
        restart-strategy.exponential-delay.backoff-multiplier: 2.0
        restart-strategy.exponential-delay.jitter-factor: 0.2
        restart-strategy.exponential-delay.reset-backoff-threshold: 1h
    ports:
      - ${FLINK_REST_PORT}:8081
    volumes:
      - flink_lib:/opt/flink/lib/ieta
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_checkpoints:/opt/flink/savepoints
    networks:
      - ieta-znz-deploy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  flink-taskmanager:
    image: flink:1.20.3-scala_2.12-java17
    profiles: ["flink", "cdc"]
    entrypoint: ["/bin/sh", "-c", "chown -R flink:flink /opt/flink/checkpoints /opt/flink/savepoints && exec /docker-entrypoint.sh taskmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-21}
        taskmanager.memory.process.size: ${FLINK_TM_MEM:-4g}
        execution.checkpointing.storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: ${FLINK_CK_INTERVAL:-60s}
        execution.checkpointing.min-pause: 30s
        execution.checkpointing.timeout: 10min
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.tolerable-failed-checkpoints: 3
        execution.checkpointing.num-retained: 3
        execution.checkpointing.mode: EXACTLY_ONCE
        restart-strategy.type: exponential-delay
        restart-strategy.exponential-delay.initial-backoff: 10s
        restart-strategy.exponential-delay.max-backoff: 2min
        restart-strategy.exponential-delay.backoff-multiplier: 2.0
        restart-strategy.exponential-delay.jitter-factor: 0.2
        restart-strategy.exponential-delay.reset-backoff-threshold: 1h
    deploy:
      replicas: ${FLINK_TM_REPLICAS:-3}
    depends_on:
      - flink-jobmanager
    volumes:
      - flink_lib:/opt/flink/lib/ieta
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_checkpoints:/opt/flink/savepoints
    networks:
      - ieta-znz-deploy
    restart: unless-stopped

  onlyoffice-document-server:
    image: onlyoffice/documentserver:9.4.0
    profiles: ["onlyoffice", "dyna-report"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    ports:
      - ${ONLYOFFICE_PORT}:80
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    networks:
      - ieta-znz-deploy
    restart: unless-stopped

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b10015
    profiles: ["llm", "llama-cpp"]
    command: ["-m", "${LLAMA_CPP_MODEL}", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096"]
    ports:
      - ${LLAMA_CPP_PORT}:8080
    volumes:
      - ./models:/models:ro
    networks:
      - ieta-znz-deploy
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.25.0
    profiles: ["llm", "vllm"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--model", "${VLLM_MODEL}"]
    ports:
      - ${VLLM_PORT}:8000
    volumes:
      - ./models:/models:ro
    networks:
      - ieta-znz-deploy
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  minio_data:
  valkey_data:
  es8_ragflow_data:
  es7_cdc_data:
  flink_lib:
  flink_checkpoints:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_lib:
  onlyoffice_db:

networks:
  ieta-znz-deploy:
    name: ${IETA_ZNZ_DEPLOY_NETWORK}
    driver: bridge
